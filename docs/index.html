<title>Productivity Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
:root{--violeta:#2D1A63;--hueso:#F7F3EA;--lima:#D4F25A;--lila:#BDAEE8;--piedra:#6E6985;--noche:#170D38;--borde:#DDD6E8;--verde:#3D6B0F;--serif:Newsreader,Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:#F7F3EA}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #2D1A63;outline-offset:2px}
.dk :focus-visible{outline-color:#D4F25A}
a{color:#2D1A63}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.app{display:flex;flex-wrap:wrap;min-height:100vh;background:#F7F3EA;color:#2D1A63;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
.side{flex:1 1 272px;max-width:296px;background:#2D1A63;color:#F7F3EA;padding:16px 14px 12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:hidden}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.wordmark{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-0.01em;line-height:1.1}
.eyebrow{font-size:11px;letter-spacing:0.2em;font-weight:500}
.side .eyebrow{color:#BDAEE8}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow:auto}
.navhead{padding:8px 10px 4px}
.navbtn{display:flex;gap:8px;align-items:center;min-height:30px;padding:3px 10px;border-radius:8px;width:100%;color:#F7F3EA;font-size:13px;line-height:1.25}
.navbtn:hover{background:rgba(189,174,232,0.12)}
.navbtn.on{background:rgba(189,174,232,0.22);font-weight:700}
.navbtn .cnt{color:#BDAEE8;font-size:12px;font-variant-numeric:tabular-nums;font-weight:400;flex:0 0 auto}
.navsep{height:1px;background:rgba(189,174,232,0.3);margin:6px 10px}
.newcat{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.newcat .ncrow{display:flex;gap:8px}
.newcat input{flex:1;min-width:0;height:32px;padding:0 12px;border-radius:8px;border:1px solid #BDAEE8;background:transparent;color:#F7F3EA}
.newcat input::placeholder{color:rgba(247,243,234,0.6)}
.plus{width:32px;height:32px;border-radius:8px;background:#D4F25A;color:#170D38;font-weight:700;font-size:18px;text-align:center}
.sync{padding:0 10px;font-size:11px;color:#BDAEE8;opacity:.85}
.syncwrap{margin-top:auto;flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding-top:4px;background:#2D1A63}
.notifbtn{margin:0 10px;min-height:32px;padding:6px 10px;border-radius:8px;border:1px solid rgba(189,174,232,0.5);color:#F7F3EA;font-size:12px;text-align:center}
.notifbtn:hover{background:rgba(189,174,232,0.12)}
.notifon{margin:0 10px;padding:2px 10px 0;font-size:11px;line-height:1.3;color:#BDAEE8;opacity:.85}

.main{flex:999 1 560px;min-width:0;padding:40px 48px 80px;display:flex;flex-direction:column;gap:32px}

/* type */
.kicker{font-size:12px;letter-spacing:0.2em;color:#6E6985;font-weight:500}
.h1{margin:0;font-family:var(--serif);font-weight:300;font-size:56px;line-height:1.05;letter-spacing:-0.01em}
.h1.cat{font-size:44px;letter-spacing:0}
.lede{margin:0;color:#6E6985;max-width:560px}
.muted{color:#6E6985}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{border:1px solid #DDD6E8;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.metric.wip{border:1.5px solid #2D1A63}
.metric .eyebrow{color:#3D6B0F;min-height:34px}
.metric .val{font-family:var(--serif);font-weight:300;font-size:40px;line-height:1}
.metric .val small{font-size:22px}
.metric .note{font-size:13px;color:#6E6985}
.metric .note.warn{color:#2D1A63;font-weight:500}

/* overview */
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cards{flex:999 1 520px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:14px;border:1px solid #DDD6E8;border-radius:12px;padding:20px;min-height:176px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#BDAEE8;box-shadow:0 2px 12px rgba(23,13,56,0.06)}
.card .head{display:flex;gap:12px;align-items:flex-start}
.badge{flex:0 0 32px;height:32px;border-radius:16px;background:#D4F25A;border:1.5px solid #2D1A63;color:#170D38;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge.lg{flex:0 0 40px;height:40px;border-radius:20px;font-size:15px}
.card .name{font-family:var(--serif);font-size:24px;line-height:1.15}
.bar{display:block;height:8px;border-radius:4px;background:#DDD6E8;overflow:hidden}
.bar>span{display:block;height:100%;background:#D4F25A}
.bar>span.some{border-right:2px solid #2D1A63}
.card .line{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.card .line.foot{color:#6E6985;margin-top:auto}
.card .next{display:block;font-size:13px;line-height:1.35}
.card .next .eyebrow{color:#6E6985}
.tnum{font-variant-numeric:tabular-nums}
.panel{flex:1 1 320px;max-width:420px;background:#2D1A63;color:#F7F3EA;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:6px}
.panel .eyebrow{color:#BDAEE8}
.up{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid rgba(189,174,232,0.3);min-height:44px;width:100%}
.up .t{font-size:15px}
.up .m{font-size:13px;color:#BDAEE8}
.review{margin-top:16px;padding-top:16px;border-top:1px solid rgba(189,174,232,0.3);display:flex;flex-direction:column;gap:8px}
.review .txt{font-size:14px;line-height:1.5}

/* category */
.back{font-size:13px;color:#6E6985;min-height:44px;display:flex;align-items:center;align-self:flex-start}
.cathead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.catmeta{display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-size:14px}
.catmeta .bar{width:220px}
.field{height:44px;padding:0 10px;border:1px solid #DDD6E8;border-radius:8px;background:transparent;color:#2D1A63}
.duelbl{display:flex;gap:8px;align-items:center;color:#6E6985}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:500;border:1px solid #DDD6E8}
.pill.on{background:#2D1A63;color:#F7F3EA;border-color:#2D1A63}
.btn-out{height:44px;padding:0 16px;border:1.5px solid #2D1A63;border-radius:22px;font-weight:500;font-size:14px}
.rows{display:flex;flex-direction:column;border-top:1px solid #DDD6E8}
.row{display:flex;gap:4px;align-items:center;border-bottom:1px solid #DDD6E8;padding:6px 0}
.chk{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center}
.box{width:24px;height:24px;border-radius:6px;border:2px solid #2D1A63;display:flex;align-items:center;justify-content:center}
.box.on{border:0;background:#2D1A63;color:#D4F25A;font-size:14px;font-weight:700}
.rowmain{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px;min-height:44px;border-radius:8px}
.rowmain:hover{background:rgba(189,174,232,0.12)}
.rtitle{font-size:16px;flex:1 1 220px;min-width:0}
.rtitle.done{color:#6E6985;text-decoration:line-through}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:12px;font-weight:500;border-radius:12px;padding:1px 10px;white-space:nowrap;color:#170D38;background:#F5D547;border:1.5px solid #2D1A63}
.st.p-alta{background:#F08A7B}
.st.p-media{background:#F5D547}
.st.p-baja{background:#8FD18A}
.st.doing{font-weight:700}
.st.blocked{border-style:dashed}
.st.done{background:#2D1A63;color:#F7F3EA;border-style:solid}
.prioleg{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:#6E6985}
.prioleg .k{display:flex;gap:6px;align-items:center}
.prioleg .dot{width:14px;height:14px;border-radius:7px;border:1.5px solid #2D1A63;display:inline-block}
.addtask select{height:44px;padding:0 10px;border:1px solid #2D1A63;border-radius:8px;background:#F7F3EA}
.due{font-size:13px;color:#6E6985;white-space:nowrap}
.due.over{font-size:13px;font-weight:700;color:#2D1A63}
.due.soon{font-size:13px;font-weight:700;color:#2D1A63}
.ind{font-size:12px;color:#6E6985}
.archbtn{flex:0 0 auto;height:44px;padding:0 14px;border:1px solid #2D1A63;border-radius:22px;font-size:13px;font-weight:500}
.empty{padding:28px 0;color:#6E6985}
.addtask{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px;background:#BDAEE8;border-radius:12px}
.addtask input{height:44px;border:1px solid #2D1A63;border-radius:8px;background:#F7F3EA}
.addtask .tt{flex:1 1 220px;min-width:0;padding:0 14px}
.addtask .dd{padding:0 10px}
.btn-solid{height:44px;padding:0 20px;border-radius:22px;background:#2D1A63;color:#F7F3EA;font-weight:500;text-align:center}
.aside{flex:1 1 300px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:20px}
.box2{border:1px solid #DDD6E8;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.box2 .eyebrow,.drawer .eyebrow{color:#6E6985}
.ta{width:100%;padding:12px;border:1px solid #DDD6E8;border-radius:8px;background:transparent;resize:vertical}
.doc{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #DDD6E8}
.doc .n{min-width:0;overflow-wrap:anywhere;font-size:14px}
.doc .n a{color:inherit;text-decoration:none}
.doc .n a:hover{text-decoration:underline}
.doc .s{color:#6E6985;font-size:12px}
.x{flex:0 0 44px;height:44px;text-align:center;color:#6E6985}
.upload{position:relative;display:flex;align-items:center;justify-content:center;height:44px;border:1.5px dashed #2D1A63;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer}
.upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.upload:focus-within{outline:2px solid #2D1A63;outline-offset:2px}

/* archive */
.arow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #DDD6E8}
.arow .l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.btn-ghost{height:44px;padding:0 14px;border-radius:22px;font-size:14px;color:#6E6985}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(23,13,56,0.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#F7F3EA;z-index:21;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:-8px 0 32px rgba(23,13,56,0.2);color:#2D1A63;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
.drawer .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer .close{width:44px;height:44px;text-align:center;font-size:18px;flex:0 0 44px}
.dtitle{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:8px;background:transparent;font-family:var(--serif);font-size:26px;line-height:1.2;resize:none}
.dtitle:hover{border-color:#DDD6E8}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.flabel{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:0.2em;color:#6E6985;font-weight:500}
.flabel select,.flabel input{height:44px;padding:0 10px;border:1px solid #2D1A63;border-radius:8px;background:transparent;letter-spacing:0;font-size:15px;color:#2D1A63;font-weight:400;width:100%}
.plan{font-size:13px;color:#6E6985;margin-top:-8px}
.dactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn-lime{flex:1 1 auto;height:44px;padding:0 20px;border-radius:22px;background:#D4F25A;border:1.5px solid #2D1A63;color:#170D38;font-weight:700;text-align:center}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#170D38;color:#F7F3EA;border-radius:12px;padding:6px 8px 6px 18px;display:flex;gap:12px;align-items:center;font-size:14px;font-family:Inter,system-ui,sans-serif;max-width:calc(100% - 32px)}
.toast.plain{padding:12px 18px}
.toast button{height:44px;padding:0 14px;color:#D4F25A;font-weight:700;flex:0 0 auto}

@media (max-width:760px){
  .side{max-width:none;flex-basis:100%;padding:20px 14px;gap:14px;position:static;max-height:none;overflow:visible}
  .nav{flex:none;overflow:visible}
  .wordmark{font-size:28px}
  .navbtn{min-height:44px;padding:6px 10px;font-size:15px}
  .navbtn .cnt{font-size:13px}
  .newcat input{height:44px}
  .plus{width:44px;height:44px;font-size:20px}
  .notifbtn{min-height:44px;font-size:13px}
  .sync{margin-top:0}
  .main{padding:28px 20px 72px;gap:24px}
  .h1{font-size:42px}
  .h1.cat{font-size:34px}
  .panel{max-width:none}
  .aside{max-width:none}
  .drawer{padding:20px}
}
@media (max-width:760px){
  .navcats{display:none}
  .navcats.open{display:flex;flex-direction:column;gap:2px}
  .navtoggle{display:flex !important}
}
.navtoggle{display:none}
</style>

<noscript><p style="padding:24px;font-family:Inter,system-ui,sans-serif">Este panel necesita JavaScript.</p></noscript>

<script>
(function () {
'use strict';

/* ---------- Roadmap inicial (primera venta: 1 de abril de 2027) ---------- */

    ['Definir el contenido del pasaporte digital y la herramienta', '2027-01-18', '2027-02-28'],

  ]],

    ['Fijar precios y márgenes de cada servicio', '2027-01-11', '2027-01-24'],
    ['Construir la cuenta de resultados, el plan de tesorería y el umbral de rentabilidad', '2027-01-11', '2027-01-31']
  ]],
  ['Estrategia de ventas', [
    ['Elegir el segmento de arranque', '2027-01-11', '2027-01-24'],
    ['Plan de prospección y CRM', '2027-02-01', '2027-02-21'],
    ['Materiales de venta: fichas de lote, presentación, kits de muestras', '2027-02-01', '2027-02-28'],
    ['Prospección de clientes piloto y envío de muestras', '2027-02-22', '2027-03-28', 1]
  ]],
  ['Financiamiento', [
    ['Investigar opciones de financiación', '2026-12-01', '2026-12-20'],
    ['Estimar el presupuesto de lanzamiento', '2026-12-14', '2027-01-10'],
    ['Preparar el dossier de financiación', '2027-01-11', '2027-02-07'],
    ['Presentar solicitudes: préstamos de honor, banco, Bpifrance', '2027-02-01', '2027-03-14']
  ]]
];

function seedData() {
  var cats = [], tasks = [], k = 0;
  SEED.forEach(function (c, i) {
    var id = 'c' + (i + 1), maxDue = '';
    c[1].forEach(function (t) {
      tasks.push({ id: 't' + (++k), cat: id, title: t[0], status: 'todo', start: t[1], due: t[2], critical: !!t[3], prio: 'media', notes: '', docs: [], archived: false, archivedAt: null });
      if (t[2] > maxDue) maxDue = t[2];
    });
    cats.push({ id: id, name: c[0], due: maxDue, notes: '', docs: [] });
  });
  return { version: 1, nid: 100, cats: cats, tasks: tasks };
}

/* ---------- Estado ---------- */
var LS_KEY = 'mg_dashboard_state_v1';
var MAX_FILE = 2 * 1024 * 1024;
var data = null;           // {version,nid,cats,tasks}
var ui = { view: 'overview', catId: 'c1', openId: null, filter: 'open', newTask: '', newDue: '', newPrio: 'media', newCat: '', toast: null, navOpen: false };
var mode = 'local';        // 'cloud' | 'local'
var syncMsg = '';

function valid(d) { return d && Array.isArray(d.cats) && Array.isArray(d.tasks) && d.cats.length > 0; }
function normalize(d) {
  d.version = d.version || 1;
  d.nid = d.nid || 100;
  d.cats.forEach(function (c) { c.docs = c.docs || []; c.notes = c.notes || ''; c.due = c.due || ''; });
  d.tasks.forEach(function (t) { t.docs = t.docs || []; t.notes = t.notes || ''; t.due = t.due || ''; t.status = t.status || 'todo'; t.archived = !!t.archived; if (!PRIO[t.prio]) t.prio = 'media'; });
  return d;
}
function readLocal() { try { var raw = localStorage.getItem(LS_KEY); if (!raw) return null; var d = JSON.parse(raw); return valid(d) ? d : null; } catch (e) { return null; } }
function writeLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); return true; }
  catch (e) { if (mode === 'local') flash('Espacio del navegador lleno: quite algún documento para seguir guardando.'); return false; }
}

function apiState() {
  var path = location.pathname || '/';
  if (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
  if (path.slice(-11) === '/index.html') path = path.slice(0, -11);
  return path + '/api/state';
}
var saveTimer = null, dirty = false;
function persist() {
  dirty = true;
  writeLocal();
  if (mode !== 'cloud') return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 700);
}
function pushCloud() {
  if (mode !== 'cloud' || !dirty) return;
  dirty = false;
  setSync('Guardando…');
  fetch(apiState(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); setSync('Guardado en la nube'); })
    .catch(function () { dirty = true; setSync('Sin conexión: guardado en este navegador'); clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 5000); });
}
function setSync(m) { syncMsg = m; var el = document.getElementById('sync'); if (el) el.textContent = m; }
window.addEventListener('pagehide', function () {
  if (mode === 'cloud' && dirty && navigator.sendBeacon) {
    try { navigator.sendBeacon(apiState(), new Blob([JSON.stringify(data)], { type: 'application/json' })); dirty = false; } catch (e) {}
  }
});

function load() {
  var local = readLocal();
  if (!/^https?:$/.test(location.protocol)) { finishLoad(local || seedData(), 'local'); return; }
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var to = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
  fetch(apiState(), { headers: { 'Accept': 'application/json' }, cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function (r) {
      clearTimeout(to);
      if (r.status === 204) return { empty: true };
      if (!r.ok || (r.headers.get('content-type') || '').indexOf('application/json') < 0) throw new Error('no api');
      return r.json();
    })
    .then(function (d) {
      if (d && !d.empty && valid(d)) { finishLoad(d, 'cloud'); setSync('Guardado en la nube'); }
      else { finishLoad(local || seedData(), 'cloud'); dirty = true; pushCloud(); }
    })
    .catch(function () { clearTimeout(to); finishLoad(local || seedData(), 'local'); });
}
function finishLoad(d, m) {
  data = normalize(d); mode = m;
  var renamed = false;
  data.cats.forEach(function (c) {
    if (c.name === 'Financiación') { c.name = 'Financiamiento'; renamed = true; }
  });
  if (m === 'local') syncMsg = 'Guardado en este navegador';
  writeLocal();
  if (renamed && m === 'cloud') persist();
  readHash();
  render();
  registerSW().then(function () { initNotifications(); });
}

/* ---------- Utilidades ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function todayDate() { var T = new Date(); T.setHours(0, 0, 0, 0); return T; }
function iso(x) { return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function today() { return iso(todayDate()); }
function daysTo(s) { var p = s.split('-').map(Number); return Math.round((new Date(p[0], p[1] - 1, p[2]) - todayDate()) / 86400000); }
var M = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sep.', 'oct.', 'nov.', 'dic.'];
function fmt(s) { if (!s) return 'Sin fecha'; var p = s.split('-').map(Number); return p[2] + ' ' + M[p[1] - 1] + (p[0] !== todayDate().getFullYear() ? ' ' + p[0] : ''); }
function sizeLabel(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function catById(id) { return data.cats.find(function (c) { return c.id === id; }); }
function catIdx(id) { return data.cats.findIndex(function (c) { return c.id === id; }); }
function taskById(id) { return data.tasks.find(function (t) { return t.id === id; }); }
function upd(id, patch) { var t = taskById(id); if (t) Object.assign(t, patch); persist(); }
function updCat(id, patch) { var c = catById(id); if (c) Object.assign(c, patch); persist(); }
function nextId(p) { data.nid = (data.nid || 100) + 1; return p + data.nid; }

function dueView(t) {
  if (t.status === 'done') return { label: t.due ? fmt(t.due) : 'Sin fecha', cls: 'due' };
  if (!t.due) return { label: 'Sin fecha', cls: 'due' };
  var n = daysTo(t.due);
  if (n < 0) return { label: 'Vencida · ' + fmt(t.due), cls: 'due over' };
  if (n <= 7) return { label: (n === 0 ? 'Hoy' : 'En ' + n + ' d') + ' · ' + fmt(t.due), cls: 'due soon' };
  return { label: fmt(t.due), cls: 'due' };
}
var PRIO = { alta: 'Alta (rojo)', media: 'Media (amarillo)', baja: 'Baja (verde)' };
var PRIO_RANK = { alta: 0, media: 1, baja: 2 };
var STATUS = { todo: 'Por hacer', doing: 'En curso', blocked: 'Bloqueada', done: 'Hecha' };
function prioOpts(sel) { return ['alta', 'media', 'baja'].map(function (p) { return '<option value="' + p + '"' + (sel === p ? ' selected' : '') + '>' + PRIO[p] + '</option>'; }).join(''); }
function catStats(c) {
  var all = data.tasks.filter(function (t) { return t.cat === c.id; });
  var done = all.filter(function (t) { return t.status === 'done'; }).length;
  var pct = all.length ? Math.round(done / all.length * 100) : 0;
  var open = all.filter(function (t) { return !t.archived && t.status !== 'done'; }).length;
  var doing = all.some(function (t) { return t.status === 'doing' || t.status === 'blocked'; });
  var statusLabel = all.length && done === all.length ? 'Completada' : (done > 0 || doing ? 'En curso' : 'Sin empezar');
  return { all: all, done: done, pct: pct, open: open, statusLabel: statusLabel, total: all.length };
}
function bar(pct) { return '<span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span class="' + (pct > 0 ? 'some' : '') + '" style="width:' + pct + '%"></span></span>'; }
function checkBox(done) { return '<span class="box' + (done ? ' on' : '') + '">' + (done ? '✓' : '') + '</span>'; }
function docsHtml(list, scope) {
  if (!list.length) return '<div style="font-size:14px;color:#6E6985">Sin documentos.</div>';
  return list.map(function (d, i) {
    var name = d.data ? '<a href="' + esc(d.data) + '" download="' + esc(d.name) + '" title="Descargar">' + esc(d.name) + '</a>' : esc(d.name);
    return '<div class="doc"><span class="n">' + name + '<span class="s"> · ' + esc(d.size) + '</span></span>' +
      '<button class="x" data-act="rmdoc" data-scope="' + scope + '" data-i="' + i + '" data-k="rmdoc-' + scope + '-' + i + '" aria-label="Quitar documento ' + esc(d.name) + '">✕</button></div>';
  }).join('');
}

/* ---------- Render ---------- */
function render() {
  var fk = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-k');
  renderSide(); renderMain(); renderDrawer(); renderToast();
  if (fk) { var el = document.querySelector('[data-k="' + fk + '"]'); if (el) el.focus({ preventScroll: true }); }
}

function renderSide() {
  var archived = data.tasks.filter(function (t) { return t.archived; }).length;
  var navCats = data.cats.map(function (c) {
    var on = ui.view === 'category' && ui.catId === c.id;
    return '<button class="navbtn' + (on ? ' on' : '') + '" data-act="cat" data-id="' + c.id + '" data-k="nav-' + c.id + '"' + (on ? ' aria-current="page"' : '') + '><span style="flex:1;min-width:0">' + esc(c.name) + '</span><span class="cnt">' + catStats(c).open + '</span></button>';
  }).join('');
  document.getElementById('side').innerHTML =
    '<div class="brand"><div class="wordmark">Mucho gusto</div><div class="eyebrow">CAFÉ MEXICANO DE ESPECIALIDAD</div></div>' +
    '<nav class="nav" aria-label="Secciones">' +
      '<button class="navbtn' + (ui.view === 'overview' ? ' on' : '') + '" data-act="overview" data-k="nav-ov"><span>Resumen</span></button>' +
      '<button class="navbtn navtoggle" data-act="navtoggle" data-k="nav-toggle" aria-expanded="' + ui.navOpen + '"><span style="flex:1">Categorías</span><span class="cnt">' + (ui.navOpen ? '▲' : '▼') + '</span></button>' +
      '<div class="navcats' + (ui.navOpen ? ' open' : '') + '" style="display:contents">' +
        '<div class="eyebrow navhead">CATEGORÍAS</div>' + navCats +
      '</div>' +
      '<div class="navsep"></div>' +
      '<button class="navbtn' + (ui.view === 'archive' ? ' on' : '') + '" data-act="archive" data-k="nav-arch"><span style="flex:1">Archivo</span><span class="cnt">' + archived + '</span></button>' +
    '</nav>' +
    '<form class="newcat" data-form="addcat"><label for="newcat" class="eyebrow">NUEVA CATEGORÍA</label>' +
      '<div class="ncrow"><input id="newcat" data-k="newcat" data-in="newCat" value="' + esc(ui.newCat) + '" placeholder="Nombre" autocomplete="off" maxlength="80">' +
      '<button type="submit" class="plus" aria-label="Añadir categoría">+</button></div></form>' +
    '<div class="syncwrap">' +
      '<div class="sync" id="sync" aria-live="polite">' + esc(syncMsg) + '</div>' +
      notifControl() +
    '</div>';
  // On desktop the wrapper is display:contents; on mobile CSS handles toggle.
  var wrap = document.querySelector('.navcats');
  if (wrap && window.matchMedia('(max-width:760px)').matches) wrap.style.display = '';
}

function renderMain() {
  var el = document.getElementById('main');
  if (ui.view === 'category') el.innerHTML = viewCategory();
  else if (ui.view === 'archive') el.innerHTML = viewArchive();
  else el.innerHTML = viewOverview();
}

function viewOverview() {
  var allT = data.tasks;
  var doneCount = allT.filter(function (t) { return t.status === 'done'; }).length;
  var doingCount = allT.filter(function (t) { return !t.archived && t.status === 'doing'; }).length;
  var live = allT.filter(function (t) { return !t.archived && t.status !== 'done' && t.due; });
  var overdue = live.filter(function (t) { return daysTo(t.due) < 0; }).length;
  var soon = live.filter(function (t) { var n = daysTo(t.due); return n >= 0 && n <= 7; }).length;
  var pct = allT.length ? Math.round(doneCount / allT.length * 100) : 0;
  var wipWarn = doingCount > 3;
  var upcoming = live.slice().sort(function (a, b) { return a.due.localeCompare(b.due); }).slice(0, 6);
  var n = data.cats.length;
  var NUM = ['Cero', 'Un', 'Dos', 'Tres', 'Cuatro', 'Cinco', 'Seis', 'Siete', 'Ocho', 'Nueve', 'Diez', 'Once', 'Doce', 'Trece', 'Catorce', 'Quince'];
  var frentes = (NUM[n] || String(n)) + (n === 1 ? ' frente' : ' frentes');

  var cards = data.cats.map(function (c, i) {
    var st = catStats(c);
    var open = data.tasks.filter(function (t) { return t.cat === c.id && !t.archived && t.status !== 'done'; })
      .sort(function (a, b) { return (a.due || '9999').localeCompare(b.due || '9999'); });
    return '<button class="card" data-act="cat" data-id="' + c.id + '" data-k="card-' + c.id + '">' +
      '<span class="head"><span class="badge">' + (i + 1) + '</span><span class="name">' + esc(c.name) + '</span></span>' +
      bar(st.pct) +

function toggleTask(id) { var t = taskById(id); upd(id, { status: t.status === 'done' ? 'todo' : 'done' }); }
function archiveTask(id) {

function goCat(id) { ui.view = 'category'; ui.catId = id; ui.filter = 'open'; ui.openId = null; ui.navOpen = false; writeHash(); render(); window.scrollTo(0, 0); }
function goView(v) { ui.view = v; ui.openId = null; ui.navOpen = false; writeHash(); render(); window.scrollTo(0, 0); }
function writeHash() { var h = ui.view === 'category' ? '#/categoria/' + ui.catId : ui.view === 'archive' ? '#/archivo' : '#/'; if (location.hash !== h) history.replaceState(null, '', h); }
function readHash() {

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  switch (a) {
    case 'overview': goView('overview'); break;
    case 'archive': goView('archive'); break;
    case 'cat': goCat(id); break;
    case 'navtoggle': ui.navOpen = !ui.navOpen; renderSide(); break;
    case 'filter': ui.filter = b.getAttribute('data-f'); render(); break;
    case 'toggle': toggleTask(id); render(); break;
    case 'opentask': {
      var t = taskById(id);
      if (ui.view !== 'category' || ui.catId !== t.cat) { ui.view = 'category'; ui.catId = t.cat; ui.filter = 'open'; writeHash(); }
      ui.openId = id; render(); break;
    }
    case 'close': ui.openId = null; render(); break;
    case 'archivetask': archiveTask(id); break;
    case 'archivedone': {
      var ids = data.tasks.filter(function (t) { return t.cat === ui.catId && !t.archived && t.status === 'done'; }).map(function (t) { return t.id; });
      if (!ids.length) { flash('No hay tareas hechas para archivar.'); break; }
      ids.forEach(function (x) { Object.assign(taskById(x), { archived: true, archivedAt: today() }); });
      persist(); render();
      flash(ids.length + (ids.length === 1 ? ' tarea archivada.' : ' tareas archivadas.'));
      break;
    }
    case 'restore': upd(id, { archived: false, archivedAt: null, status: 'todo' }); render(); break;
    case 'deletetask': {
      var tk = taskById(id);
      if (!tk || !confirm('¿Eliminar definitivamente «' + tk.title + '»? Esta acción no se puede deshacer.')) break;
      data.tasks = data.tasks.filter(function (x) { return x.id !== id; });
      if (ui.openId === id) ui.openId = null;
      persist(); render(); break;
    }
    case 'rmdoc': {
      var scope = b.getAttribute('data-scope'), i = +b.getAttribute('data-i');
      var owner = scope === 'cat' ? catById(ui.catId) : taskById(ui.openId);
      if (owner && confirm('¿Quitar «' + owner.docs[i].name + '»?')) { owner.docs = owner.docs.filter(function (_, j) { return j !== i; }); persist(); render(); }
      break;
    }
    case 'notif': enableNotifications(); break;
    case 'undo': {
      var u = ui.toast && ui.toast.undo;
      if (u) upd(u.id, { archived: false, archivedAt: null, status: u.prev.status });
      clearTimeout(toastTimer); ui.toast = null; render(); break;
    }
  }
});

document.addEventListener('change', function (e) {
  var el = e.target, k = el.getAttribute('data-ch');
  if (k === 'catDue') { updCat(ui.catId, { due: el.value }); render(); return; }
  if (k === 'newPrio') { ui.newPrio = PRIO[el.value] ? el.value : 'media'; return; }
  if (k === 'dPrio') { var tp = taskById(ui.openId); if (!tp) return; upd(tp.id, { prio: PRIO[el.value] ? el.value : 'media' }); render(); return; }
  if (k === 'dStatus' || k === 'dDue') {
    var t = taskById(ui.openId); if (!t) return;
    if (k === 'dStatus') upd(t.id, { status: el.value }); else upd(t.id, { due: el.value });
    render();
    if (k === 'dStatus' && el.value === 'doing') {
      var n = data.tasks.filter(function (x) { return !x.archived && x.status === 'doing'; }).length;
      if (n > 3) flash('Demasiadas a la vez: termine una antes de abrir otra.');
    }
    return;
  }
  var scope = el.getAttribute('data-file');
  if (scope) {
    var f = el.files && el.files[0]; el.value = '';
    if (!f) return;
    if (f.size > MAX_FILE) { flash('«' + f.name + '» pesa ' + sizeLabel(f.size) + '. El límite es 2 MB por documento.'); return; }
    var owner = scope === 'cat' ? catById(ui.catId) : taskById(ui.openId);
    var ownerId = owner && owner.id;
    var r = new FileReader();
    r.onload = function () {
      var o = scope === 'cat' ? catById(ownerId) : taskById(ownerId); if (!o) return;
      o.docs = o.docs.concat([{ name: f.name, size: sizeLabel(f.size), bytes: f.size, type: f.type || 'application/octet-stream', addedAt: today(), data: r.result }]);
      persist(); render();
    };
    r.onerror = function () { flash('No se pudo leer el documento.'); };
    r.readAsDataURL(f);
  }
});

  }).formatToParts(d).forEach(function (p) { if (p.type !== 'literal') parts[p.type] = p.value; });

    date: parts.year + '-' + parts.month + '-' + parts.day,
    hour: +parts.hour,
    minute: +parts.minute,
    second: +parts.second
  };
}
function addDaysISO(iso, n) {
  var p = iso.split('-').map(Number);
  var x = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  x.setUTCDate(x.getUTCDate() + n);
  return x.toISOString().slice(0, 10);
}
function tzOffsetMs(date, tz) {
  var parts = {};
  new Intl.DateTimeFormat('en-GB', {
    timeZone: tz,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hourCycle: 'h23'
  }).formatToParts(date).forEach(function (p) { if (p.type !== 'literal') parts[p.type] = p.value; });
  var asUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
  return asUTC - date.getTime();
}
function parisWallTimeMs(isoDate, hour) {
  var p = isoDate.split('-').map(Number);
  var guess = Date.UTC(p[0], p[1] - 1, p[2], hour, 0, 0);
  var utc = guess - tzOffsetMs(new Date(guess), NOTIF_TZ);
  utc = guess - tzOffsetMs(new Date(utc), NOTIF_TZ);
  return utc;
}
function currentNotifSlot(now) {
  now = now || parisNow();
  for (var i = 0; i < NOTIF_SLOTS.length; i++) {
    if (now.hour >= NOTIF_SLOTS[i].hour && now.hour < NOTIF_SLOTS[i].until) return NOTIF_SLOTS[i];
  }
  return null;
}
function nextNotifAt() {
  var now = parisNow();
  var date = now.date;
  var hour = null;
  for (var i = 0; i < NOTIF_SLOTS.length; i++) {
    if (now.hour < NOTIF_SLOTS[i].hour) { hour = NOTIF_SLOTS[i].hour; break; }
  }
  if (hour == null) { hour = NOTIF_SLOTS[0].hour; date = addDaysISO(date, 1); }
  return parisWallTimeMs(date, hour);
}
function slotStorageKey(date, id) { return date + ':' + id; }
function slotWasSent(key) {
  try {
    var map = JSON.parse(localStorage.getItem(NOTIF_SLOTS_KEY) || '{}');
    return !!map[key];
  } catch (e) { return false; }
}
function markSlotSent(key) {
  try {
    var map = {};
    try { map = JSON.parse(localStorage.getItem(NOTIF_SLOTS_KEY) || '{}'); } catch (e) {}
    map[key] = 1;
    var cutoff = addDaysISO(parisNow().date, -2);
    Object.keys(map).forEach(function (k) { if (k.slice(0, 10) < cutoff) delete map[k]; });
    localStorage.setItem(NOTIF_SLOTS_KEY, JSON.stringify(map));
  } catch (e) {}
}
function openNotifTasks() {
  return data.tasks.filter(function (t) { return !t.archived && t.status !== 'done'; });
}
function tasksForSlot(slot) {
  var today = parisNow().date;
  var tomorrow = addDaysISO(today, 1);
  var overdue = [], dueToday = [], dueTomorrow = [];
  openNotifTasks().forEach(function (t) {
    if (!t.due) return;
    if (t.due < today) overdue.push(t);
    else if (t.due === today) dueToday.push(t);
    else if (slot.includeTomorrow && t.due === tomorrow) dueTomorrow.push(t);
  });
  return { overdue: overdue, dueToday: dueToday, dueTomorrow: dueTomorrow };
}
function taskNotifLine(t) {
  var c = catById(t.cat);
  return t.title + (c ? ' · ' + c.name : '');
}
function groupBody(arr) {
  return arr.slice(0, 4).map(taskNotifLine).join('\n') + (arr.length > 4 ? '\n+' + (arr.length - 4) + ' más' : '');
}
function fireNotification(item) {
  var opts = {
    body: item.body,
    tag: item.tag,
    icon: NOTIF_ICON,
    badge: NOTIF_ICON,
    lang: 'es',
    requireInteraction: item.tag === 'mg-overdue' || item.tag === 'mg-today',
    data: { url: location.href }
  };
  if (navigator.serviceWorker) {
    return navigator.serviceWorker.ready.then(function (reg) {
      if (reg.showNotification) return reg.showNotification(item.title, opts);
      try { new Notification(item.title, opts); } catch (e) {}
    }).catch(function () {
      try { new Notification(item.title, opts); } catch (e2) {}
    });
  }
  try { new Notification(item.title, opts); } catch (e) {}
  return Promise.resolve();
}
function maybeNotifyCurrentSlot() {
  if (!data || !notifSupported() || Notification.permission !== 'granted') return;
  var now = parisNow();
  var slot = currentNotifSlot(now);
  if (!slot) return;
  var key = slotStorageKey(now.date, slot.id);
  if (slotWasSent(key)) return;
  var g = tasksForSlot(slot);
  var items = [];
  if (g.overdue.length) {
    items.push({
      tag: 'mg-overdue',
      title: g.overdue.length === 1 ? 'Tarea vencida' : g.overdue.length + ' tareas vencidas',
      body: groupBody(g.overdue)
    });
  }
  if (g.dueToday.length) {
    items.push({
      tag: 'mg-today',
      title: g.dueToday.length === 1 ? 'Tarea para hoy' : g.dueToday.length + ' tareas para hoy',
      body: groupBody(g.dueToday)
    });
  }
  if (g.dueTomorrow.length) {
    items.push({
      tag: 'mg-tomorrow',
      title: g.dueTomorrow.length === 1 ? 'Tarea para mañana' : g.dueTomorrow.length + ' tareas para mañana',
      body: groupBody(g.dueTomorrow)
    });
  }
  markSlotSent(key);
  if (!items.length) return;
  items.reduce(function (p, item) {
    return Promise.resolve(p).then(function () { return fireNotification(item); });
  }, Promise.resolve());
}
function scheduleNextSlot() {
  clearTimeout(notifTimer);
  if (!notifSupported() || Notification.permission !== 'granted') return;
  var wait = Math.max(1000, Math.min(nextNotifAt() - Date.now(), 12 * 60 * 60 * 1000));
  notifTimer = setTimeout(function () {
    maybeNotifyCurrentSlot();
    scheduleNextSlot();
  }, wait);
}
function initNotifications() {
  maybeNotifyCurrentSlot();
  scheduleNextSlot();
}
function enableNotifications() {
  if (!notifSupported()) { flash('Este navegador no admite notificaciones.'); return; }
  Notification.requestPermission().then(function (perm) {
    renderSide();
    if (perm === 'granted') {
      flash('Notificaciones activadas. Aviso a las 7:00 por lo de hoy y mañana, y a las 14:00, 16:00, 18:00 y 20:00 por lo pendiente de hoy.');
      initNotifications();
    } else if (perm === 'denied') {
      flash('El navegador ha bloqueado las notificaciones. Puedes activarlas en la configuración del sitio.');
    }
  });
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') initNotifications();
});

load();
})();
</script>
